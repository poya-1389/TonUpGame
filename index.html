<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0D1020');tg?.setBackgroundColor?.('#080914');
const T={fa:{n1:'پروفایل',n2:'وظایف',n3:'بازی',n4:'لیدربرد',n5:'دعوت',balance:'موجودی',earned:'درآمد',gift:'کد هدیه',activate:'فعال‌سازی',notasks:'در حال حاضر وظیفه‌ای برای انجام وجود ندارد.',go:'انجام وظیفه',done:'انجام شد',soon:'به‌زودی',invite:'دعوت دوستان',copy:'کپی لینک',share:'اشتراک‌گذاری',tot:'کل دعوت‌ها',act:'فعال',pend:'در انتظار',norank:'هنوز رتبه‌بندی‌ای نیست',me:'رتبه من',err:'خطایی رخ داد. لطفاً دوباره تلاش کنید.',maint:'🛠️ TonUp در حال تعمیر است. لطفاً بعداً دوباره تلاش کنید.',ok:'انجام شد',copied:'کپی شد',loading:'در حال بارگذاری...',e_invalid_code:'کد نامعتبر است',e_expired:'کد منقضی شده',e_exhausted:'ظرفیت کد تمام شده',e_limit_reached:'قبلاً استفاده کرده‌اید',e_not_member:'هنوز عضو نشده‌اید',e_already_done:'قبلاً انجام شده',e_slow_down:'کمی آهسته‌تر',friends:'دوستان',earners:'🏆 بیشترین درآمد',rich:'💎 ثروتمندترین‌ها'},
en:{n1:'Profile',n2:'Tasks',n3:'Games',n4:'Ranks',n5:'Invite',balance:'BALANCE',earned:'Earned',gift:'Gift code',activate:'ACTIVATE',notasks:'No tasks available',go:'DO TASK',done:'DONE',soon:'COMING SOON',invite:'Invite Friends',copy:'COPY LINK',share:'SHARE',tot:'Invites',act:'Active',pend:'Pending',norank:'No rankings yet',me:'My rank',err:'Something went wrong. Please try again.',maint:'🛠️ TonUp is under maintenance. Please try again later.',ok:'Done',copied:'Copied',loading:'Loading...',e_invalid_code:'Invalid code',e_expired:'Code expired',e_exhausted:'Code fully used',e_limit_reached:'Already redeemed',e_not_member:'You have not joined yet',e_already_done:'Already done',e_slow_down:'Slow down',friends:'Friends',earners:'🏆 Top Earners',rich:'💎 Richest'}};
let lang=localStorage.lang||((tg?.initDataUnsafe?.user?.language_code||'fa').startsWith('fa')?'fa':'en'),token='',board='earners',U={};
const $=id=>document.getElementById(id),t=k=>T[lang][k]||k,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+token}});const j=await r.json().catch(()=>({}));if(!r.ok)throw{status:r.status,code:j.detail||j.error};return j}
function errMsg(e){return e.status===503?t('maint'):T[lang]['e_'+e.code]||t('err')}

async function loadTasks(){const l=await api('/tasks');$('tasks').innerHTML=l.length?l.map(x=>`<div class="card task"><div class="ic">${{join_channel:'📣',join_group:'👥',visit_link:'🔗',start_bot:'🤖',view_content:'👁'}[x.type]||'🎯'}</div><div class="b"><h4>${esc(x.title)}</h4><div class="mut">${esc(x.description)}</div><div class="rw en">+${fmt(x.reward)} TON</div></div><button class="btn" data-id="${x.id}" data-u="${esc(x.target)}" data-t="${x.type}" ${x.done?'disabled':''}>${x.done?t('done'):t('go')}</button></div>`).join(''):`<div class="empty"><em>🎁</em><h3>${t('notasks')}</h3></div>`;

try{const r=await api('/tasks/'+b.dataset.id+'/claim',{method:'POST'});hap('success');toast('🎉 +'+fmt(r.reward)+' TON');U.balance=r.balance;renderProfile();loadTasks()}catch(e){hap('error');toast(errMsg(e))}})}
async function loadBoard(){const d=await api('/leaderboard?kind='+board);const tabs=`<div style="display:flex;gap:8px;margin-bottom:14px"><button class="chip" data-k="earners">${t('earners')}</button><button class="chip" data-k="rich">${t('rich')}</button></div>`;

$('top').innerHTML=tabs+`<div class="pod">${o.map((x,i)=>x?`<div class="${cls[i]}"><span style="font-size:30px">${m[i]}</span><b>${esc(x.name)}</b><span class="en">${fmt(x.value)}</span></div>`:'').join('')}</div><div class="card">${d.top.slice(3).map(x=>`<div class="li"><span class="r">${x.rank}</span><span class="a">${x.photo?`<img src="${esc(x.photo)}" width=32 height=32 style="border-radius:50%">`:'👤'}</span>${esc(x.name)}<span class="t en">${fmt(x.value)}</span></div>`).join('')}</div>`;

document.querySelectorAll('#top [data-k]').forEach(b=>b.onclick=()=>{board=b.dataset.k;loadBoard()})}
async function loadInvite(){const d=await api('/referrals');$('invite').innerHTML=`<div class="card c"><div style="font-size:48px">🎁</div><h3>${t('invite')}</h3><p class="mut">+1 TON · +2.5 TON</p><input class="input en" id="rl" readonly dir="ltr" value="${esc(d.link)}"><button class="btn" id="cp">${t('copy')}</button><button class="btn v" id="sh" style="margin-top:8px">${t('share')}</button></div><div class="stat"><div><b>${d.total}</b><small class="mut">${t('tot')}</small></div><div><b>${d.active}</b><small class="mut">${t('act')}</small></div><div><b class="en">${fmt(d.earned)}</b><small class="mut">TON</small></div></div><div class="card">${d.friends.map(f=>`<div class="li">👤 ${esc(f.name)}<span class="mut">${f.active?t('act'):'⏳'}</span><span class="t en">+${fmt(f.reward)}</span></div>`).join('')||`<p class="mut c">${t('friends')}: 0</p>`}</div>`;
$('cp').onclick=()=>{navigator.clipboard?.writeText(d.link);toast(t('copied'));tg?.HapticFeedback?.impactOccurred('medium')};
$('sh').onclick=()=>{const u='https://t.me/share/url?url='+encodeURIComponent(d.link);tg?tg.openTelegramLink(u):window.open(u)}}
$('gb').onclick=async()=>{const c=$('gc').value.trim();if(!c)return;try{const r=await api('/gift',{method:'POST',body:JSON.stringify({code:c})});hap('success');toast('🎉 +'+fmt(r.reward)+' TON');U.balance=r.balance;renderProfile();$('gc').value=''}catch(e){hap('error');toast(errMsg(e))}};
function load(s){const f={tasks:loadTasks,top:loadBoard,invite:loadInvite}[s];f&&f().catch(e=>toast(errMsg(e)))}
function renderAll(){renderProfile()}
(async()=>{applyLang();$('ovmsg').textContent=t('loading');
try{const a=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({init_data:tg?.initData||''})});const j=await a.json();if(!a.ok)throw{status:a.status};if(j.maintenance){$('ovmsg').textContent=t('maint');return}
token=j.token;U=j.user;renderProfile();applyLang();
const sp=tg?.initDataUnsafe?.start_param||'';if(sp.startsWith('gift_')){$('gc').value=sp.slice(5)}
setTimeout(()=>$('ov').classList.add('off'),600)}catch(e){$('ovmsg').textContent=t('err')}})();
</script></body></html>
